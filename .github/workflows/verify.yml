name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Extension and RAG Lab
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            experiments/echo-rag-evaluation/package-lock.json
      - name: Install extension dependencies
        run: npm ci
        working-directory: extension
      - name: Test extension
        run: npm test
        working-directory: extension
      - name: Typecheck extension
        run: npm run typecheck
        working-directory: extension
      - name: Build extension
        run: npm run build
        working-directory: extension
      - name: Install RAG Lab dependencies
        run: npm ci
        working-directory: experiments/echo-rag-evaluation
      - name: Test RAG Lab
        run: npm test
        working-directory: experiments/echo-rag-evaluation
      - name: Typecheck RAG Lab
        run: npm run typecheck
        working-directory: experiments/echo-rag-evaluation
